name: oceano

services:
  exchange-router-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-router-service
    ports:
      - "127.0.0.1:${EXCHANGE_ROUTER_SERVICE_PORT:-8040}:8040"
    volumes:
      - ./tools/auditor/runs:/app/tools/auditor/runs
    env_file:
      - .env
    healthcheck:
      test: curl -f http://localhost:8040/status
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped