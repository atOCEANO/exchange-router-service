# Release: check the tag against the service version, then publish a GitHub
# Release with notes. Same shape as emsl's release, minus the build matrix,
# because there is nothing here to build for anyone. emsl ships wheels because a
# library has to arrive as a file; this is a service you run, so the artifact is
# the repository at the tag, which GitHub attaches on its own. The client SDK is
# versioned on its own line and installs straight from the tag, so shipping a
# wheel here would only publish a file whose number disagrees with the release.
#
# A v* tag releases. A manual dispatch runs the guard and stops, so the check can
# be dry-run before committing to a tag:
#   Actions -> release -> Run workflow

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The guard the release hangs off. v2.2.0 was tagged on a commit whose
  # src/version.py still read 2.1.0, so a running container reported a version
  # that no tag matched and nothing anywhere noticed. Every tag from v2.2.1 on
  # has agreed; this is what keeps it that way.
  version:
    name: the tag matches the service version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # a dispatch has no tag to match
    steps:
      - uses: actions/checkout@v4
      - name: compare the tag against src/version.py
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(sed -n 's/^SERVICE_VERSION *= *"\(.*\)"/\1/p' src/version.py)
          echo "tag ${GITHUB_REF_NAME} -> ${tag}"
          echo "src/version.py    -> ${src}"
          if [ -z "$src" ]; then
            echo "::error::could not read SERVICE_VERSION out of src/version.py"
            exit 1
          fi
          if [ "$tag" != "$src" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match SERVICE_VERSION ${src}; bump src/version.py or move the tag"
            exit 1
          fi

  release:
    name: publish the release
    needs: [version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # a dispatch checks only, never releases
    permissions:
      contents: write # creating a release writes to the repo
    steps:
      # no `files:`, so the assets are the source archives GitHub attaches
      # itself. That is the thing you actually download to run this.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            `exchange-router-service` is a stateless, keyless router over public
            crypto market data. One endpoint, one schema, and every registered
            adapter speaks it. REST and WebSocket sit on the same port and the
            same adapter instance serves both, so a client written against one
            exchange and market type works against another with a single path
            change.

            There is nothing to install from this page. Take the source below, or
            clone at the tag, and run it either of the two ways.

            ## Run it without Docker

            ```bash
            git clone --branch ${{ github.ref_name }} https://github.com/atOCEANO/exchange-router-service.git
            cd exchange-router-service
            python -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt
            uvicorn src.main:app --port 8040
            ```

            On Windows, activate with `.venv\Scripts\activate`. Requires Python
            3.10 or newer. Add `--reload` while working on an adapter.

            ## Run it with Docker

            The image is built from the repository, so there is no registry to
            pull from and nothing to trust but the source you just cloned:

            ```bash
            git clone --branch ${{ github.ref_name }} https://github.com/atOCEANO/exchange-router-service.git
            cd exchange-router-service
            cp .env.example .env
            docker compose up --build
            ```

            Compose binds to `127.0.0.1:8040` by default; set
            `EXCHANGE_ROUTER_SERVICE_PORT` in `.env` to move it. To skip compose,
            `docker build -t exchange-router-service .` and
            `docker run --rm -p 8040:8040 exchange-router-service`.

            Either way, confirm it is up:

            ```bash
            curl http://localhost:8040/version
            curl http://localhost:8040/exchanges
            ```

            ## The Python client

            A typed client lives in `client/` and installs straight from this tag.
            It is versioned on its own line, so its number will not match the
            service number, and that is intended:

            ```bash
            pip install "git+https://github.com/atOCEANO/exchange-router-service.git@${{ github.ref_name }}#subdirectory=client"
            ```

            No `await`, and it runs identically in a script and in a notebook:

            ```python
            from exchange_router_client import ExchangeRouterClient

            with ExchangeRouterClient("http://localhost:8040") as client:
                print(client.get_version())
                print(client.get_exchanges())

                df = client.get_candles("binance", "spot", "BTCUSDT", interval="1h", limit=100)
                print(df.tail())
            ```

            The client holds persistent connections, so release it when done. The
            `with` block guarantees cleanup; outside one, call `client.close()`.
            See [Python SDK](https://github.com/atOCEANO/exchange-router-service/blob/${{ github.ref_name }}/.Documentation/Python_SDK.md)
            for the full surface.

            ## What is in it

            - Every registered adapter behind one schema, across spot, linear and
              inverse markets. The set supported at this tag is listed in
              [Supported Exchanges](https://github.com/atOCEANO/exchange-router-service/blob/${{ github.ref_name }}/README.md#supported-exchanges);
              adding one is a new adapter and no change to the routing core.
            - One normalized wire format. Raw upstream dicts never cross the
              boundary; every response is a Pydantic model from `src/models.py`.
            - Nested value objects on every quantitative record: `qty`, `volume`
              and `open_interest` each come back as
              `{native, unit, contract_size?, usd, usd_basis?}`, so one record
              carries both the raw upstream value and a quote-currency notional
              with the conversion basis spelled out.
            - A `kind: "discrete" | "continuous"` discriminator on funding, so a
              position-PnL calculation branches on the funding model itself with no
              exchange-specific code.
            - Rate-limit and ban avoidance per upstream host: proactive backoff off
              the used-weight header, `Retry-After` honoured on 429 and 418, and a
              fail-fast 503 once retries are spent.
            - One upstream WebSocket per `(channel, symbol)` tuple, fanned out to
              every attached client and cancelled when the last subscriber leaves.

            ## Scope

            Public market data only. It places no orders, holds no API keys,
            manages no accounts, and writes nothing to disk. If you need
            authentication or private endpoints, this is not it.

            ## Verified

            Honestly and narrowly. The real suite is the auditor
            (`python -m tools.auditor`), and it runs against live exchange APIs
            from a developer machine, because hosted runners issue from datacenter
            IPs that several of these exchanges block. CI therefore checks only
            what needs no upstream: every adapter package registers an adapter and
            declares a non-empty capabilities map and at least one market type, the
            client SDK installs into a clean interpreter and imports, the image
            builds and boots, and this tag matches `SERVICE_VERSION`. Treat the
            auditor run, not this release, as the evidence that a given adapter is
            correct against its exchange.
